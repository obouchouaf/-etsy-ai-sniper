<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron">
<meta name="theme-color" content="#1b1512">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="description" content="A personal push/pull/legs training coach — builds your week, guides every rep, and tracks your progress. Works fully offline.">
<title>Iron — Push / Pull / Legs</title>
<style>
:root{
  --bg:#141317; --surface:#1c1b21; --surface-2:#232229; --line:#2f2e37;
  --ink:#f4f1ea; --dim:#9b958c; --accent:#e8412c; --gold:#e8b23a;
  --shadow:0 16px 40px rgba(0,0,0,.55);
  --r:16px; --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
}
[data-theme="light"]{
  --bg:#f4f1ea; --surface:#fffdf9; --surface-2:#f0ece3; --line:#e0dad0;
  --ink:#1b1a18; --dim:#7d776e; --shadow:0 14px 34px rgba(60,50,35,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{touch-action:manipulation;background:var(--bg);color:var(--ink);font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none;transition:background .25s,color .25s}
input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.ic{width:20px;height:20px;flex:0 0 auto;display:inline-block;vertical-align:-4px}
.ic.sm{width:16px;height:16px;vertical-align:-3px}
.ic.lg{width:26px;height:26px}
#sprite{display:none}
svg.figsvg{width:100%;height:100%;display:block;overflow:visible}
svg.figsvg .prop{fill:none;stroke:var(--dim);stroke-width:2.6;stroke-linecap:round;opacity:.55}
svg.figsvg .prop.f{fill:var(--dim);opacity:.55}
svg.figsvg .prop.pl{stroke-width:3.6}
svg.figsvg .cbl{fill:none;stroke:var(--dim);stroke-width:1.3}
svg.figsvg .far{fill:none;stroke:var(--dim);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.6}
svg.figsvg .body{fill:none;stroke:var(--ink);stroke-width:5.6;stroke-linecap:round;stroke-linejoin:round}
svg.figsvg .head{fill:var(--ink)}
svg.figsvg .ld{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round}
svg.figsvg .ld.thick{stroke-width:6.5}
svg.figsvg .ld.f{fill:var(--accent);stroke:none}
.thumb{width:54px;height:44px;border-radius:10px;background:var(--surface-2);flex:0 0 auto;padding:2px;display:grid;place-items:center;color:var(--dim)}
.figstrip{display:flex;gap:6px;margin-top:9px}
.figstrip .thumb{width:46px;height:38px;background:color-mix(in srgb,var(--c) 14%,var(--surface-2))}
.demo{background:var(--surface-2);border-radius:14px;padding:10px 10px 8px;margin-bottom:12px}
.demo .stagebox{height:158px}
.demo .ctl{display:flex;align-items:center;gap:9px;margin-top:2px}
.demo input[type=range]{flex:1;accent-color:var(--accent);height:28px;background:none}
.cueline{display:flex;gap:9px;font-size:13px;color:var(--dim);margin-bottom:7px;line-height:1.45}
.cueline b{color:var(--accent);font-weight:800;flex:0 0 auto}
.mus{font-size:11px;font-weight:750;color:var(--dim);letter-spacing:.09em;text-transform:uppercase;margin:0 0 10px}
#cFigWrap{position:absolute;width:min(56vw,240px);height:min(46vw,196px)}
#cRead{text-align:center;margin-top:2px}
#cRead .big{font-size:clamp(48px,15vw,78px);line-height:.95}
#cRead .of{margin-top:2px}#cRead .cue{margin-top:6px}

#app{padding:calc(var(--st) + 14px) 16px calc(150px + var(--sb));max-width:660px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.top .meta{font-size:13px;color:var(--dim);margin-top:2px}
.top .ring{margin-left:auto;position:relative;width:52px;height:52px;flex:0 0 auto}
.top .ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800}

/* ---- day cards ---- */
.daygrid{display:grid;gap:11px}
.daycard{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);width:100%;text-align:left;
  background:linear-gradient(105deg,color-mix(in srgb,var(--c) 16%,var(--surface)),var(--surface) 62%);
  border:1px solid var(--line);transition:transform .12s ease}
.daycard:active{transform:scale(.985)}
.badge-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--c);color:#fff;flex:0 0 auto}
.daycard h3{margin:0;font-size:18px;font-weight:750;letter-spacing:-.02em}
.daycard p{margin:2px 0 0;font-size:13px;color:var(--dim)}
.pill{font-size:11px;font-weight:750;padding:5px 9px;border-radius:99px;background:var(--c);color:#fff;white-space:nowrap}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px}
.stat b{display:block;font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat span{font-size:11.5px;color:var(--dim)}

/* ---- exercise cards ---- */
.exlist{display:grid;gap:11px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:border-color .2s}
.ex.done{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.ex-head{display:flex;gap:12px;align-items:center;padding:14px;width:100%;text-align:left}
.eq{width:36px;height:36px;border-radius:10px;background:var(--surface-2);color:var(--dim);display:grid;place-items:center;flex:0 0 auto;transition:.2s}
.ex.done .eq{background:var(--accent);color:#fff}
.ex-name{font-size:15.5px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.ex-scheme{font-size:12.5px;color:var(--dim);margin-top:2px}
.plates{display:flex;gap:3px;margin-top:7px}
.plate{width:15px;height:6px;border-radius:2px;background:var(--surface-2);transition:background .25s,transform .25s}
.plate.on{background:var(--accent);transform:scaleY(1.35)}
.chev{margin-left:auto;color:var(--dim);transition:transform .25s}
.ex.open .chev{transform:rotate(180deg)}
.ex-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s cubic-bezier(.4,0,.2,1)}
.ex.open .ex-body{grid-template-rows:1fr}
.ex-inner{overflow:hidden}
.ex-pad{padding:0 14px 14px}
.wrow{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:12px;padding:8px 10px;margin-bottom:12px}
.wrow .lb{font-size:12px;color:var(--dim);font-weight:600;flex:1}
.step{width:34px;height:34px;border-radius:9px;background:var(--bg);display:grid;place-items:center;flex:0 0 auto}
.step:active{background:var(--accent);color:#fff}
.wval{min-width:74px;text-align:center;font-size:19px;font-weight:800;letter-spacing:-.02em}
.wval small{font-size:11px;font-weight:600;color:var(--dim);margin-left:2px}
.setrow{display:grid;grid-template-columns:24px 1fr 38px 38px 38px;gap:7px;align-items:center;margin-bottom:8px}
.wzbar{height:5px;background:var(--surface-2);border-radius:3px;margin-bottom:22px;overflow:hidden}
.wzbar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .35s}
.wz-h{font-size:23px;font-weight:800;letter-spacing:-.03em;margin:0 0 16px;line-height:1.15}
.wznav{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:20px;align-items:center}
.daycard.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.pbar{height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .45s}
.pbar.gold i{background:var(--gold)}
.pbl{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:6px}
.pbl b{color:var(--ink);font-weight:700}
.week{display:flex;gap:5px;margin-bottom:14px}
.wd{flex:1;text-align:center;padding:7px 0;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:10.5px;color:var(--dim)}
.wd b{display:block;font-size:12px;margin-top:3px;color:var(--ink);font-weight:750}
.wd.did{border-color:var(--accent)}.wd.did b{color:var(--accent)}
.wd.plan{border-style:dashed}
.wd.today{box-shadow:inset 0 0 0 2px var(--accent)}
.wu{background:var(--surface-2);border-radius:11px;padding:9px 11px;margin-bottom:11px}
.wu-h{font-size:10.5px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.wu-r{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;color:var(--dim)}
.wu-r b{color:var(--ink)}
.act.rir{font-size:10.5px;font-weight:750;color:var(--dim)}
.act.rir.on{background:color-mix(in srgb,var(--gold) 20%,var(--surface-2));color:var(--gold)}
.plate.pr{background:var(--gold)}
.banner{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--gold) 13%,var(--surface));
  border:1px solid color-mix(in srgb,var(--gold) 38%,var(--line));border-radius:14px;padding:12px;margin-bottom:12px;font-size:13.5px;line-height:1.45}
.banner .ic{color:var(--gold);margin-top:1px}
.toast button{background:var(--bg);color:var(--ink);padding:5px 11px;border-radius:99px;font-size:12.5px;font-weight:750;margin-left:6px}
.setrow .n{font-size:12px;color:var(--dim);font-weight:700}
.reps{display:flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:11px;padding:4px}
.reps input{flex:1;min-width:0;background:none;border:0;color:var(--ink);text-align:center;font-size:17px;font-weight:750;padding:6px 0}
.reps input:focus{outline:none;color:var(--accent)}
.reps .step{width:30px;height:30px;background:var(--bg)}
.act{height:42px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;transition:.15s}
.act.go{background:color-mix(in srgb,var(--accent) 16%,var(--surface-2));color:var(--accent)}
.act.tick.on{background:var(--accent);color:#fff}
.act:active{transform:scale(.94)}
.subline{font-size:12.5px;color:var(--dim);margin:0 0 10px}
.hint{font-size:12.5px;color:var(--dim);border-left:2px solid var(--line);padding-left:10px;margin-top:12px}
.flag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:750;color:#241c05;background:var(--gold);
  padding:4px 9px;border-radius:99px;margin-bottom:10px}
.flag.pr{background:var(--accent);color:#fff}

/* ---- generic ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px}
.card h4{margin:0 0 3px;font-size:15.5px;font-weight:750;display:flex;align-items:center;gap:8px}
.card .sub{font-size:12.5px;color:var(--dim)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:13px;
  background:var(--accent);color:#fff;font-weight:750;font-size:16px;letter-spacing:-.01em;transition:transform .12s}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:11px;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rowline{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.rowline:last-child{border-bottom:0}
.rowline .t{flex:1;font-size:14.5px}
.rowline .t small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.sw{width:50px;height:30px;border-radius:99px;background:var(--surface-2);position:relative;flex:0 0 auto;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--dim);transition:.2s}
.sw.on{background:color-mix(in srgb,var(--accent) 40%,var(--surface-2))}
.sw.on i{left:23px;background:var(--accent)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:8px 13px;border-radius:99px;border:1px solid var(--line);font-size:13.5px;font-weight:650;color:var(--dim)}
.chip.on{background:var(--accent);color:#fff;border-color:transparent}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid transparent}
.dot.on{border-color:var(--ink)}
input.txt,select.txt{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);
  padding:12px;border-radius:11px;font-size:15.5px}
input.txt:focus,select.txt:focus{outline:2px solid var(--accent);outline-offset:-1px}
label.fl{display:block;font-size:12px;color:var(--dim);font-weight:650;margin:0 0 5px}
.empty{text-align:center;color:var(--dim);font-size:14px;padding:34px 20px;line-height:1.6}

/* ---- bottom nav ---- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding:7px 6px calc(7px + var(--sb));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
nav button{padding:5px 2px;font-size:10.5px;font-weight:650;color:var(--dim);display:grid;gap:3px;justify-items:center;transition:color .2s}
nav button.on{color:var(--accent)}
nav button .ic{transition:transform .2s}
nav button.on .ic{transform:translateY(-1px) scale(1.08)}

/* ---- docked action / rest ---- */
#dock{position:fixed;left:0;right:0;bottom:calc(64px + var(--sb));z-index:41;padding:0 12px;pointer-events:none}
.dockin{max-width:636px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:10px 12px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);pointer-events:auto;
  transform:translateY(140%);transition:transform .3s cubic-bezier(.3,1.3,.5,1)}
#dock.on .dockin{transform:none}
.dockin .t{font-size:25px;font-weight:800;min-width:66px;letter-spacing:-.03em}
.dockin .w{flex:1;font-size:12.5px;color:var(--dim);line-height:1.25;min-width:0}
.dockin .w b{display:block;color:var(--ink);font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dockin .mini{padding:9px 11px;border-radius:10px;background:var(--surface-2);font-size:13px;font-weight:700;flex:0 0 auto}
.dockin .mini.go{background:var(--accent);color:#fff}
.restfill{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);border-radius:0 0 14px 14px;transition:width .25s linear}

/* ---- counter ---- */
#counter{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;
  padding:calc(var(--st) + 14px) 18px calc(16px + var(--sb))}
#counter.on{display:flex}
.c-top{display:flex;align-items:flex-start;gap:12px}
.c-top .nm{font-size:16px;font-weight:750;letter-spacing:-.01em}
.c-top .sb{font-size:12.5px;color:var(--dim);margin-top:2px}
.iconbtn.tiny{width:30px;height:30px;border-radius:9px}
.iconbtn:disabled{opacity:.28}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center;color:var(--dim);flex:0 0 auto}
.stage{flex:1;display:grid;place-items:center;position:relative;min-height:230px}
.stage svg.arc{position:absolute;width:min(80vw,330px);height:min(80vw,330px);transform:rotate(-90deg)}
.pulse{position:absolute;width:min(56vw,232px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 30%,transparent),color-mix(in srgb,var(--accent) 6%,transparent) 70%);
  transform:scale(.5);will-change:transform}
.tapzone{position:absolute;inset:-10px;border-radius:50%}
.readout{position:relative;text-align:center;pointer-events:none}
.readout .big{font-size:clamp(84px,28vw,140px);font-weight:800;line-height:.9;letter-spacing:-.06em}
.readout .of{font-size:14px;color:var(--dim);font-weight:650;margin-top:8px}
.readout .cue{font-size:12px;font-weight:800;letter-spacing:.18em;color:var(--accent);margin-top:12px;height:16px}
.c-ctrl{display:grid;gap:11px}
.c-w{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:2px}
.c-row{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px}
.c-row button{padding:15px;border-radius:13px;background:var(--surface);border:1px solid var(--line);font-weight:750;font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:7px}
.c-row button.prime{background:var(--accent);color:#fff;border-color:transparent}
.c-row button:active{transform:scale(.97)}

/* ---- sheet ---- */
#sheet{position:fixed;inset:0;z-index:70;display:none}
#sheet.on{display:block}
#sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .25s}
#sheet.on .scrim{opacity:1}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;
  padding:10px 18px calc(20px + var(--sb));max-height:88vh;overflow:auto;transform:translateY(100%);
  transition:transform .3s cubic-bezier(.3,1,.4,1);box-shadow:var(--shadow)}
#sheet.on .panel{transform:none}
.grab{width:38px;height:4px;border-radius:9px;background:var(--line);margin:2px auto 14px}
.sheet-h{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0 0 14px}
.f{margin-bottom:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.toast{position:fixed;left:50%;bottom:calc(140px + var(--sb));transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:700;padding:11px 17px;border-radius:99px;
  opacity:0;pointer-events:none;transition:.2s;z-index:80;display:flex;align-items:center;gap:8px}
.toast.on{opacity:1;transform:translateX(-50%)}

:root{
  --bg:#1b1512; --surface:#241c18; --surface-2:#2e251f; --line:#3a2f27;
  --ink:#f6ece0; --dim:#b6a595; --accent:#ff7a54; --gold:#f2b552; --mint:#4fc79a; --danger:#f0664e;
  --r:22px; --r-sm:15px; --r-xs:11px;
  --shadow:0 18px 44px -12px rgba(0,0,0,.62), 0 2px 8px -3px rgba(0,0,0,.45);
  --shadow-sm:0 9px 24px -14px rgba(0,0,0,.7);
  --font:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
}
[data-theme="light"]{
  --bg:#f5eee3; --surface:#fffcf7; --surface-2:#efe4d4; --line:#e8dac8;
  --ink:#3b2f27; --dim:#9a8878; --accent:#f2663d; --gold:#e2952a; --mint:#2ea87e; --danger:#d64f3a;
  --shadow:0 16px 34px -14px rgba(120,74,40,.30), 0 2px 8px -3px rgba(120,74,40,.16);
  --shadow-sm:0 8px 20px -13px rgba(120,74,40,.30);
}
body{font-family:var(--font);font-weight:500}
.top h1,.wz-h,.sheet-h,.daycard h3,.readout .big,#cRead .big,.stat b,.wval,.dockin .t,.c-top .nm,.big{font-family:var(--font-display);letter-spacing:0}
.top h1{font-weight:600;letter-spacing:-.01em}
.wz-h,.sheet-h,.daycard h3{font-weight:600}
.readout .big,#cRead .big{font-weight:600;letter-spacing:-.015em}
.stat b,.wval,.dockin .t{font-weight:600}
.card h4{font-weight:800}
.card{border-radius:var(--r);box-shadow:var(--shadow-sm)}
.daycard{border-radius:var(--r);box-shadow:var(--shadow-sm)}
.ex{border-radius:var(--r)}
.stat{border-radius:var(--r-sm)}
.btn{border-radius:var(--r-sm)}
.btn:not(.ghost){box-shadow:0 12px 24px -14px color-mix(in srgb,var(--accent) 85%,transparent)}
.badge-ic{border-radius:14px}
.eq,.thumb{border-radius:13px}
nav{background:color-mix(in srgb,var(--bg) 82%,transparent)}
.dockin,.wu,.demo{border-radius:var(--r)}
.wrow,.reps,.banner{border-radius:14px}
.empty{display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 22px}
.empty>.ic{width:34px;height:34px;padding:15px;border-radius:50%;background:var(--surface-2);color:var(--accent);box-sizing:content-box;vertical-align:0}
.empty>span{max-width:34ch}
.volbars{display:flex;align-items:flex-end;gap:7px;height:96px;margin-top:14px}
.vb{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.vb i{display:block;width:100%;max-width:30px;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 45%,var(--surface-2)));border-radius:7px 7px 3px 3px;transition:height .5s cubic-bezier(.3,1,.4,1)}
.vb span{font-size:10px;color:var(--dim);font-weight:700}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
#confetti i{position:absolute;top:-12vh;border-radius:3px;will-change:transform,opacity;animation:cf var(--d,1.5s) cubic-bezier(.25,.6,.4,1) forwards}
@keyframes cf{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translate(var(--x,0),118vh) rotate(var(--r,540deg));opacity:0}}

/* ═══ anatomy animation layer ═══ */
svg.figsvg .ld{stroke:var(--gold)}
svg.figsvg .ld.f{fill:var(--gold);stroke:none}
svg.figsvg .mhi{fill:none;stroke:var(--accent);stroke-linecap:round;stroke-linejoin:round}
svg.figsvg .mhi.glow{opacity:.32}
svg.figsvg .joint{fill:var(--surface);stroke:var(--ink);stroke-width:2.2}
svg.figsvg .arw{fill:none;stroke:var(--mint);stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}
svg.figsvg .arw.h{fill:var(--mint);stroke:none}
.alegend{display:grid;gap:10px;margin:6px 0 13px}
.al{display:flex;gap:11px;align-items:flex-start;font-size:12.5px;color:var(--dim);line-height:1.42}
.al b{display:block;color:var(--ink);font-weight:800;font-size:11.5px}
.ak{width:12px;height:12px;border-radius:4px;flex:0 0 auto;margin-top:3px;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 0%,transparent)}

/* ═══ muscle map ═══ */
.muscles{background:var(--surface-2);border-radius:16px;padding:12px 12px 10px;margin:4px 0 13px}
svg.mmap{width:100%;height:172px;display:block;margin:2px 0 10px}
svg.mmap .mm{stroke:var(--line);stroke-width:.5}
svg.mmap .base{fill:color-mix(in srgb,var(--ink) 20%,var(--surface))}
svg.mmap .neu{fill:color-mix(in srgb,var(--ink) 9%,var(--surface))}
svg.mmap .sec{fill:color-mix(in srgb,var(--gold) 80%,var(--surface))}
svg.mmap .pri{fill:var(--accent)}
svg.mmap .lbl{fill:var(--dim);font:6px var(--font);text-anchor:middle;font-weight:700;letter-spacing:.06em}
.mlist{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.mtag{font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:99px}
.mtag.pri{background:var(--accent);color:#fff}
.mtag.sec{background:color-mix(in srgb,var(--gold) 24%,var(--surface));color:var(--ink);border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line))}
.msep{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin:0 1px}

/* ═══ live muscle strip in the rep counter ═══ */
.cmuscle{margin:2px auto 0;max-width:330px;width:100%}
.cmuscle .mmap{height:74px;margin:0}
.cmuscle.live svg.mmap .pri{opacity:calc(.28 + .72*var(--k,1));transition:opacity .06s linear}
.cmuscle .mlist{margin-top:3px;gap:5px}
.cmuscle .mtag{font-size:10px;padding:2px 8px;font-weight:800}
.cmuscle .msep{font-size:9px}
#counter .stage{min-height:150px}

/* ═══ detailed anatomy: glow, flex, labels ═══ */
svg.mmap .line{fill:none;stroke:color-mix(in srgb,var(--ink) 30%,var(--surface));stroke-width:.9}
svg.mmap .glow{fill:var(--accent);opacity:.20;transform-box:fill-box;transform-origin:center;transform:scale(1.3)}
svg.mmap .mlab{fill:#fff;font:6px var(--font);font-weight:800;text-anchor:middle;paint-order:stroke;stroke:rgba(0,0,0,.5);stroke-width:1.6}
#cFigWrap.flexbody{position:absolute;width:min(84vw,340px);height:min(60vh,260px)}
#cFigWrap.flexbody svg.mmap{height:100%}
#cFigWrap.flexbody svg.mmap .pri{opacity:calc(.45 + .55*var(--k,1))}
#cFigWrap.flexbody svg.mmap .pri.flex{transform-box:fill-box;transform-origin:center;transform:scale(var(--flex,1))}
#cFigWrap.flexbody svg.mmap .glow{opacity:calc(.06 + .32*var(--k,1));transform:scale(calc(1.12 + .3*var(--k,1)))}
#cFigWrap.flexbody svg.mmap .mlab{font-size:6.6px}
</style>
</head>

function slotCount(min){ return min<=30?4:min<=45?5:min<=60?6:7; }
function dayLoc(pf,i){
  if(pf.where==="gym") return "gym";
  if(pf.where==="home") return "home";
  const wd=(pf.weekdays||[])[i];
  return (pf.gymDays||[]).includes(wd)?"gym":"home";
}
function canDo(e,loc,pf){
  if(e.loc!=="any"&&e.loc!==loc) return false;
  if((pf.avoid||[]).some(j=>(e.j||[]).includes(j))) return false;
  if((pf.dislikes||[]).includes(e.i)) return false;
  if(loc==="home"){ const have=pf.equip||[]; if(!(e.q||[]).every(q=>have.includes(q))) return false; }
  return true;
}
const FALLBACK={h_press:["chest_iso","v_press"],v_press:["side_delt","h_press"],chest_iso:["h_press","triceps"],
 side_delt:["rear_delt","v_press"],triceps:["h_press","chest_iso"],v_pull:["h_pull","lat_iso"],h_pull:["v_pull","rear_delt"],

 calves:["core","glute"],core:["glute","calves"]};
function poolFor(slot,loc,pf,used){
  return LIB.filter(e=>e.slot===slot&&canDo(e,loc,pf)&&!(used||[]).includes(e.i))
            .sort((a,b)=>b.rank-a.rank);
}
function tune(e,pf,core){
  const g=GOALS[pf.goal]||GOALS.muscle, x=EXPS[pf.exp]||EXPS.some;
  const big=["h_press","v_press","v_pull","h_pull","squat","hinge"].includes(e.slot);
  let lo=Math.max(3,e.lo+(big?g.rep:Math.round(g.rep/2)));
  let hi=Math.max(lo+2,e.hi+(big?g.rep:Math.round(g.rep/2)));
  let s=Math.max(2,e.s+(core?0:x.set)+(g.set||0));
  if(hi-lo>8) hi=lo+8;
  return {id:e.i,n:e.n,eq:e.e,pat:SLOTS[e.slot],slot:e.slot,core:core?1:0,loc:e.loc,
    s,lo,hi,rest:Math.max(30,e.rest+g.rest),inc:e.inc,start:"",tip:e.tip,fig:e.fig,mus:e.m,q:e.q,j:e.j};
}
function buildPlan(pf){
  const nDays=Math.min(6,Math.max(2,+pf.days||3));
  let split=SPLITS[nDays];
  if(nDays===3&&pf.split==="full") split=SPLITS_ALT[3];
  const order=[],days={};
  split.k.forEach((type,i)=>{
    const t=DAYT[type], loc=dayLoc(pf,i), used=[], ex=[];
    const slots=t.slots.slice(0,slotCount(pf.minutes||60));
    slots.forEach((slot,si)=>{
      let pick=poolFor(slot,loc,pf,used)[0];
      if(!pick) for(const alt of (FALLBACK[slot]||[])){ pick=poolFor(alt,loc,pf,used)[0]; if(pick) break; }
      if(!pick) pick=LIB.filter(e=>canDo(e,loc,pf)&&!used.includes(e.i)).sort((a,b)=>b.rank-a.rank)[0];
      if(!pick) return;
      used.push(pick.i); ex.push(tune(pick,pf,si<3));
    });
    order.push(type);
    days[type]={name:t.n,sub:t.sub,color:t.c,type,loc,ex};
  });
  return {order,days,lib:3,split:split.name};
}
function altsFor(dayKey,exId){

  const pf=S.profile||{}; const used=d.ex.map(e=>e.id);
  return LIB.filter(e=>e.slot===cur.slot&&e.i!==exId&&canDo(e,d.loc||"gym",pf)&&!used.includes(e.i))
            .sort((a,b)=>b.rank-a.rank).slice(0,6);
}
function swapExercise(dayKey,exId,newId){
  const d=P().days[dayKey], i=d.ex.findIndex(e=>e.id===exId), src=BY_ID[newId];
  if(i<0||!src) return;
  const old=d.ex[i];
  d.ex[i]=Object.assign(tune(src,S.profile||{},!!old.core),{s:old.s,lo:old.lo,hi:old.hi,rest:old.rest});
  if(S.current&&S.current.picks){ const j=S.current.picks.indexOf(exId);
    if(j>=0){ S.current.picks[j]=newId;
      if(!(S.current.entries[exId]||[]).some(s=>s.done)) delete S.current.entries[exId];
      S.current.entries[newId]=blankSets(d.ex[i]);
      if(S.current.open===exId) S.current.open=newId; } }
}

/* ---------- engine ---------- */
const _l=(a,b,t)=>a+(b-a)*t;
const _p=(a,b,t)=>[_l(a[0],b[0],t),_l(a[1],b[1],t)];
function poseAt(d,t){
  return { hd:_p(d.a.hd,d.b.hd,t),
    seg:d.a.seg.map((s,i)=>s.map((p,j)=>_p(p,d.b.seg[i][j],t))) };
}
const _d=pts=>pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");

function propSVG(list,P){
  let o="";
  (list||[]).forEach(pr=>{
    const [k,a,b,c,e]=pr;
    if(k==="bench") o+=`<path d="M${a} ${c}H${b}M${a+7} ${c}V92M${b-7} ${c}V92"/>`;
    if(k==="incline") o+=`<path d="M${a} ${e}L${a+16} ${c}H${b}M${b-7} ${c}V92M${a+14} ${c}V92"/>`;
    if(k==="seatback") o+=`<path d="M${a} ${c}H${b}M${a} ${c}V${e}M${a+6} ${c}V90M${b-4} ${c}V90"/>`;
    if(k==="tower") o+=`<path d="M${a} ${b}V92"/><circle cx="${a}" cy="${b}" r="3.5"/>`;
    if(k==="towerlow") o+=`<path d="M${a} 30V92"/><circle cx="${a}" cy="${b}" r="3.5"/>`;
    if(k==="pulldownframe") o+=`<path d="M${a} ${b}V92M${a} ${b}H${c}"/><circle cx="${c}" cy="${b}" r="3.5"/>`;
    if(k==="rowstation") o+=`<path d="M${a} 92V${b}M${c} ${e}v10M${c-6} ${e}h12M46 72h28M70 72v18"/><circle cx="${a+1}" cy="${b-1}" r="3.5"/>`;
    if(k==="legpress") o+=`<path d="M${a} ${b}L${c} ${e}M26 70h22"/>`;
    if(k==="box") o+=`<path d="M${a} ${c}H${b}M${a+3} ${c}V92M${b-3} ${c}V92"/>`;
    if(k==="block") o+=`<path d="M${a} ${c}H${b}M${a} ${c}V88H${b}V${c}"/>`;
    if(k==="floor") o+=`<path d="M${a} ${c}H${b}"/>`;
    if(k==="bars") o+=`<path d="M${a} ${c}H${b}M${a+4} ${c}V90M${b-4} ${c}V90"/>`;
    if(k==="barh") o+=`<path d="M${a} ${c}H${b}M${a+4} ${c}V4M${b-4} ${c}V4"/>`;
    if(k==="table") o+=`<path d="M${a} ${c}H${b}M${a+5} ${c}V91M${b-5} ${c}V91"/>`;
    if(k==="anchor") o+=`<path d="M${a} ${b-6}v12"/><circle cx="${a}" cy="${b}" r="3"/>`;
  });
  return o;
}
function loadSVG(kind,P,def){
  if(!kind||kind==="none") return "";
  const near=P.seg[4], far=P.seg[1];
  const hand=s=>s[s.length-1], elb=s=>s[s.length-2];
  const ang=s=>Math.atan2(hand(s)[1]-elb(s)[1],hand(s)[0]-elb(s)[0]);
  const db=(s,along)=>{ const h=hand(s); const a=ang(s)+(along?0:Math.PI/2);
    const dx=Math.cos(a)*4.6,dy=Math.sin(a)*4.6, px=-Math.sin(a)*2.6,py=Math.cos(a)*2.6;
    return `<path class="ld" d="M${(h[0]-dx).toFixed(1)} ${(h[1]-dy).toFixed(1)}L${(h[0]+dx).toFixed(1)} ${(h[1]+dy).toFixed(1)}"/>`+
      [1,-1].map(k=>`<path class="ld thick" d="M${(h[0]+dx*k-px).toFixed(1)} ${(h[1]+dy*k-py).toFixed(1)}L${(h[0]+dx*k+px).toFixed(1)} ${(h[1]+dy*k+py).toFixed(1)}"/>`).join("");
  };
  if(kind==="db") return db(far,0)+db(near,0);
  if(kind==="db1") return db(near,0);
  if(kind==="dbh") return db(far,1)+db(near,1);
  if(kind==="handle"){ const h=hand(near); return `<circle class="ld f" cx="${h[0].toFixed(1)}" cy="${h[1].toFixed(1)}" r="3"/>`; }
  if(kind==="rope"){ const h=hand(near);
    return `<path class="ld" d="M${(h[0]-3).toFixed(1)} ${(h[1]+1).toFixed(1)}l-2 6M${(h[0]+3).toFixed(1)} ${(h[1]+1).toFixed(1)}l2 6"/>`; }
  if(kind==="hipbar"||kind==="barback"){ const pt=kind==="hipbar"?P.seg[2][2]:P.seg[2][0];
    return `<path class="ld thick" d="M${(pt[0]-7).toFixed(1)} ${pt[1].toFixed(1)}L${(pt[0]+7).toFixed(1)} ${pt[1].toFixed(1)}"/>`
      +[-7,7].map(k2=>`<path class="ld" d="M${(pt[0]+k2).toFixed(1)} ${(pt[1]-4).toFixed(1)}v8"/>`).join(""); }
  if(kind==="bar"||kind==="barsm"){ const h=hand(near); const a=ang(near)+Math.PI/2;
    const L=kind==="barsm"?5:9, dx=Math.cos(a)*L,dy=Math.sin(a)*L;
    return `<path class="ld thick" d="M${(h[0]-dx).toFixed(1)} ${(h[1]-dy).toFixed(1)}L${(h[0]+dx).toFixed(1)} ${(h[1]+dy).toFixed(1)}"/>`; }
  return "";
}
const _lerp2=(a,b,f)=>[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];
const _seg=(pts,w,cls)=>`<path class="${cls}" style="stroke-width:${w}" d="${pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("")}"/>`;

let AC=null,wake=null;
function audio(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(AC&&AC.state==="suspended")AC.resume(); return AC; }
function beep(f=760,ms=90,v=.22){ if(!S.settings.sound)return; const a=audio(); if(!a)return;
  const o=a.createOscillator(),g=a.createGain(); o.type="sine"; o.frequency.value=f; g.gain.value=0;
  o.connect(g); g.connect(a.destination); const t=a.currentTime;
  g.gain.linearRampToValueAtTime(v,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+ms/1000);
  o.start(t); o.stop(t+ms/1000+.02); }
function say(x){ if(!S.settings.voice||!("speechSynthesis" in window))return;
  try{const u=new SpeechSynthesisUtterance(String(x)); u.rate=1.15; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){} }

function celebrate(big){ if(RM) return;
  let host=document.getElementById("confetti");
  if(!host){ host=document.createElement("div"); host.id="confetti"; document.body.appendChild(host); }
  const cols=big?["#f2663d","#eab43e","#57b487","#5b9bf0","#ef73a3","#9b7cf0"]:["#f2663d","#eab43e","#57b487"];
  const N=big?72:26;
  for(let i=0;i<N;i++){ const s=document.createElement("i");
    s.style.left=(Math.random()*100).toFixed(1)+"vw";
    s.style.background=cols[i%cols.length];
    s.style.width=(6+Math.random()*7).toFixed(1)+"px"; s.style.height=(9+Math.random()*8).toFixed(1)+"px";

}

function weekNo(){ if(!S.startDate)return 1;
  return Math.max(1,Math.floor((Date.now()-new Date(S.startDate+"T12:00:00").getTime())/86400000/7)+1); }
function nextDay(){ const o=P().order; const last=S.history.length?S.history[S.history.length-1].day:null;
  if(!last||o.indexOf(last)<0) return o[0]; return o[(o.indexOf(last)+1)%o.length]; }
function lastEntry(id){ for(let i=S.history.length-1;i>=0;i--){ const e=S.history[i].entries[id];
  if(e&&e.some(x=>x.done)) return {sets:e.filter(x=>x.done),date:S.history[i].date}; } return null; }

  return L.sets.length>=ex.s && L.sets.every(x=>Number(x.r)>=ex.hi); }
const e1rm=(w,r)=>(Number(w)||0)*(1+(Number(r)||0)/30);
function bestE1RM(id,upto){ let b=0; S.history.forEach((h,i)=>{ if(upto!=null&&i>=upto)return;

function warmup(ex,w){ const v=parseFloat(w);

/* ---- STATS ---- */
function volTrend(){
  const byWeek={};
  S.history.forEach(h=>{ const d=new Date(h.date+"T12:00:00"); const m=new Date(d); m.setDate(d.getDate()-((d.getDay()+6)%7));
    const wk=m.toISOString().slice(0,10); byWeek[wk]=(byWeek[wk]||0)+volume(h.entries); });
  const weeks=Object.keys(byWeek).sort().slice(-8);
  if(weeks.length<2) return "";
  const max=Math.max(...weeks.map(w=>byWeek[w]))||1;
  const up=byWeek[weeks[weeks.length-1]]>=byWeek[weeks[weeks.length-2]];
  return `<div class="card"><h4>${ic("i-chart","sm")}Weekly volume</h4>
    <div class="sub">Total ${U()} lifted each week — the number that should climb across a block. ${up?"Trending up.":"Down on last week — normal on a deload."}</div>
    <div class="volbars">${weeks.map(w=>{ const dt=new Date(w+"T12:00:00"); const hh=Math.round(byWeek[w]/max*100);
      return `<div class="vb"><i style="height:${Math.max(6,hh)}%"></i><span>${dt.getDate()}/${dt.getMonth()+1}</span></div>`; }).join("")}</div>
  </div>`;
}
function viewStats(){
  const map=allEx(); const ids=Object.keys(map);
  let sel=S.ui.progressEx; if(!map[sel]) sel=ids[0];
  const ex=map[sel]; const rows=[];
  S.history.forEach(h=>{const e=h.entries[sel]; if(e&&e.some(x=>x.done)) rows.push({date:h.date,sets:e.filter(x=>x.done)});});
  const best=bestE1RM(sel);
  const topW=rows.map(r=>Math.max(...r.sets.map(s=>Number(s.w)||0)));
  return `<div class="top"><div><h1>Stats</h1><div class="meta">${S.history.length} sessions · ${S.history.reduce((a,h)=>a+volume(h.entries),0).toLocaleString()} ${U()} moved</div></div></div>
    ${volTrend()}
    <select class="txt" id="progSel" style="margin-bottom:12px">${P().order.map(k=>`<optgroup label="${esc(P().days[k].name)}">${
      P().days[k].ex.map(e=>`<option value="${e.id}" ${e.id===sel?"selected":""}>${esc(e.n)}</option>`).join("")}</optgroup>`).join("")}</select>
    <div class="card">
      <h4>${ic(EQ[ex.eq]||"i-dumbbell","sm")}${esc(ex.n)}</h4>
      <div class="sub">${ex.s} × ${ex.lo}–${ex.hi} · steps of ${ex.inc} ${U()}</div>
      ${topW.length>1?chart(topW,rows.map(r=>fmtDate(r.date))):`<div class="empty">${ic("i-chart","lg")}<span>Log this exercise twice and the curve appears here.</span></div>`}
      ${best?`<div class="flag pr">${ic("i-trophy","sm")}Best set ≈ ${Math.round(best)} ${U()} estimated max</div>`:""}
      ${readyToAdd(sel)?`<div class="flag">${ic("i-plus","sm")}All sets hit ${ex.hi} — add ${ex.inc} ${U()}</div>`:""}
      ${(()=>{const p=plateau(sel); return p?`<div class="banner" style="margin:12px 0 0">${ic("i-flame","sm")}<span>Stuck at ${p.w} ${U()} for ${p.n} sessions.
        Try one lighter week, add a set, or swap the movement — all three break a stall.
        <br><button class="btn sm" style="margin-top:8px;width:auto;display:inline-flex;padding:8px 14px" data-swap="${ex.day||P().order[0]}|${sel}">Swap it</button></span></div>`:""})()}
    </div>
    ${rows.length?`<div class="card">${rows.slice().reverse().map(r=>`<div class="rowline">
      <span class="t" style="flex:0 0 66px;color:var(--dim);font-size:12.5px">${fmtDate(r.date)}</span>
      <span class="t" style="text-align:right;font-weight:650">${r.sets.map(s=>`${s.w||"–"}×${s.r}`).join("&nbsp; ")}</span></div>`).join("")}</div>`:""}
    <div class="card"><h4>${ic("i-clock","sm")}Recent sessions</h4>
      ${S.history.length?S.history.slice(-(S.ui.histN||8)).reverse().map(h=>{const hi=S.history.indexOf(h);return `<div class="rowline">
        <span class="badge-ic" style="width:30px;height:30px;border-radius:9px;background:${(P().days[h.day]||{}).color||"#888"}">${ic("i-dumbbell","sm")}</span>
        <span class="t">${esc((P().days[h.day]||{}).name||h.day)}<small>${fmtDate(h.date)} · ${h.minutes||0} min</small></span>
        <span style="font-weight:700;margin-left:auto">${volume(h.entries).toLocaleString()} ${U()}</span>
        <button class="iconbtn tiny" data-delhist="${hi}" aria-label="Delete session">${ic("i-trash","sm")}</button></div>`;}).join(""):`<div class="empty">${ic("i-clock","lg")}<span>No sessions yet — your first workout shows up here.</span></div>`}
      ${S.history.length>(S.ui.histN||8)?`<div style="height:10px"></div><button class="btn ghost sm" data-morehist>Show more</button>`:""}
    </div>`;
}
function chart(vals,labels){
  const w=320,h=110,p=14,max=Math.max(...vals),min=Math.min(...vals),rng=(max-min)||1;
  const pts=vals.map((v,i)=>[p+i*(w-2*p)/(Math.max(1,vals.length-1)),h-22-((v-min)/rng)*(h-42)]);
  const line=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  const area=line+` L${pts[pts.length-1][0].toFixed(1)} ${h-18} L${pts[0][0].toFixed(1)} ${h-18} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:118px;display:block;margin:10px 0 4px" preserveAspectRatio="none">
    <path d="${area}" fill="var(--accent)" opacity=".13"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(q=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3.2" fill="var(--bg)" stroke="var(--accent)" stroke-width="2.2"/>`).join("")}
    <text x="2" y="10" fill="var(--dim)" font-size="10">${max}</text>
    <text x="2" y="${h-4}" fill="var(--dim)" font-size="10">${labels[0]}</text>
    <text x="${w-2}" y="${h-4}" fill="var(--dim)" font-size="10" text-anchor="end">${labels[labels.length-1]}</text>
  </svg>`;
}

/* ═══════════ DOCK (rest timer / next set) ═══════════ */
let rest={end:0,total:0,tick:null,label:""};
function startRest(sec,label){ if(!S.settings.autoRest){drawDock();return;}
  rest.end=Date.now()+sec*1000; rest.total=sec; rest.label=label||"Rest"; rest._b3=false;
  if(S.current){ S.current.restEnd=rest.end; S.current.restTotal=sec; S.current.restLabel=rest.label; save(); }
  clearInterval(rest.tick); rest.tick=setInterval(tickRest,250); tickRest(); }
function tickRest(){ const left=(rest.end-Date.now())/1000;
  if(left<=0){ clearInterval(rest.tick); rest.end=0; if(S.current){ delete S.current.restEnd; delete S.current.restTotal; delete S.current.restLabel; save(); } beep(920,180,.26); say("Go"); buzz([20,60,20]); drawDock(); return; }
  const t=$("#dockT"); if(t){ t.textContent=mmss(left); const f=$("#restFill"); if(f) f.style.width=(100*(1-left/rest.total)).toFixed(1)+"%"; }
  else drawDock();
  if(!rest._b3&&left<=3.3&&left>3.0){ rest._b3=true; beep(620,80,.18); } }
function nextIncomplete(){ if(!S.current) return null;
  for(const e of sessionList()){ const st=S.current.entries[e.id]||[]; const j=st.findIndex(s=>!s.done); if(j>=0) return {ex:e,idx:j}; } return null; }
function drawDock(){
  const dock=$("#dock"), box=$("#dockIn");

    rest.end=S.current.restEnd; rest.total=S.current.restTotal||120; rest.label=S.current.restLabel||"Rest";
    rest._b3=(rest.end-Date.now())/1000<=3.0; clearInterval(rest.tick); rest.tick=setInterval(tickRest,250); }
  if(rest.end>Date.now()){
    box.innerHTML=`<div class="t" id="dockT">${mmss((rest.end-Date.now())/1000)}</div>
      <div class="w"><b>Resting</b>${esc(rest.label)}</div>
      <button class="mini" data-rest="15">+15s</button><button class="mini" data-rest="skip">Skip</button>
      <div class="restfill" id="restFill" style="width:0"></div>`;
    dock.classList.add("on"); return;
  }
  const n=S.current?nextIncomplete():null;
  if(n){ box.innerHTML=`<span class="eq" style="width:36px;height:36px">${ic(EQ[n.ex.eq]||"i-dumbbell")}</span>

}

      <div class="ctl"><button class="step" data-figplay>${ic("i-pause","sm")}</button>

    <div class="chips" style="margin-bottom:12px">${[2,3,4,5].map(t=>`<button class="chip ${S.settings.tempo===t?"on":""}" data-tempo="${t}">${t}s / rep</button>`).join("")}</div>
    ${muscleBlock(id)}
    ${anatomyLegend(id)}
    ${q.c.map((c,i)=>`<div class="cueline"><b>${i+1}</b><span>${esc(c)}</span></div>`).join("")}
    ${ex.s?`<p class="sub" style="margin-top:10px">${ex.s} × ${ex.lo}–${ex.hi} · rest ${ex.rest}s · steps of ${ex.inc} ${U()}</p>`:""}
    <div style="height:14px"></div><button class="btn" data-closesheet>Close</button>`); }
function closeSheet(){ $("#sheet").classList.remove("on"); }
function editExercise(dayKey,exId){
  const d=P().days[dayKey]; const isNew=!exId;
  const e=isNew?{id:"x"+Date.now().toString(36),n:"",eq:"dumbbell",s:3,lo:8,hi:12,rest:90,inc:2.5,start:"",tip:""}:d.ex.find(x=>x.id===exId);
  openSheet(`<h3 class="sheet-h">${isNew?"New exercise":"Edit exercise"}</h3>
    <div class="f"><label class="fl">Name</label><input class="txt" id="fN" value="${esc(e.n)}" placeholder="e.g. Chest-supported row"></div>
    <div class="f"><label class="fl">Equipment</label><div class="chips" id="fEq">
      ${Object.keys(EQ).map(k=>`<button class="chip ${e.eq===k?"on":""}" data-eq="${k}">${ic(EQ[k],"sm")} ${k==="body"?"bodyweight":k}</button>`).join("")}</div></div>
    <div class="grid2">
      <div class="f"><label class="fl">Sets</label><input class="txt" id="fS" inputmode="numeric" value="${e.s}"></div>
      <div class="f"><label class="fl">Rest (seconds)</label><input class="txt" id="fRest" inputmode="numeric" value="${e.rest}"></div>
      <div class="f"><label class="fl">Reps from</label><input class="txt" id="fLo" inputmode="numeric" value="${e.lo}"></div>
      <div class="f"><label class="fl">Reps to</label><input class="txt" id="fHi" inputmode="numeric" value="${e.hi}"></div>
    </div>
    <div class="grid2">
      <div class="f"><label class="fl">Weight step (${U()})</label><input class="txt" id="fInc" inputmode="decimal" value="${e.inc}"></div>
      <div class="f"><label class="fl">Where</label><select class="txt" id="fLoc">${[["gym","Gym"],["home","Home"],["any","Both"]].map(([v,l])=>
        `<option value="${v}" ${(e.loc||"any")===v?"selected":""}>${l}</option>`).join("")}</select></div>
    </div>
    <div class="rowline" style="margin-bottom:8px"><span class="t">Mandatory<small>Always included when you build this day</small></span>
      <button class="sw ${e.core?"on":""}" data-fcore><i></i></button></div>
    <div class="f"><label class="fl">Note to yourself</label><input class="txt" id="fTip" value="${esc(e.tip||"")}" placeholder="Cue, setup, seat height…"></div>
    <button class="btn" data-saveex="${dayKey}|${isNew?"":e.id}">${ic("i-check")}Save exercise</button>
    ${isNew?"":`<div style="height:9px"></div><button class="btn ghost sm" style="color:var(--danger)" data-delex="${dayKey}|${e.id}">${ic("i-trash","sm")}Remove from plan</button>`}
    <div style="height:9px"></div><button class="btn ghost sm" data-closesheet>Cancel</button>`);
  window._draft=e;
}
function editDay(k){
  const d=P().days[k];
  openSheet(`<h3 class="sheet-h">Edit day</h3>
    <div class="f"><label class="fl">Name</label><input class="txt" id="dN" value="${esc(d.name)}"></div>
    <div class="f"><label class="fl">Subtitle</label><input class="txt" id="dS" value="${esc(d.sub)}"></div>
    <div class="f"><label class="fl">Colour</label><div class="chips">${SWATCH.map(c=>
      `<button class="dot ${d.color===c?"on":""}" style="background:${c}" data-color="${k}|${c}"></button>`).join("")}</div></div>
    <button class="btn" data-saveday="${k}">${ic("i-check")}Save day</button>
    <div style="height:9px"></div><button class="btn ghost sm" data-closesheet>Cancel</button>`);
}

/* ═══════════ EVENTS ═══════════ */
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-tab],[data-start],[data-open],[data-tick],[data-count],[data-finish],[data-cancel],[data-tempo],[data-wstep],[data-rstep],[data-cw],[data-rest],[data-theme],[data-unit],[data-color],[data-countin],[data-toggle],[data-editday],[data-editex],[data-addex],[data-move],[data-saveex],[data-delex],[data-saveday],[data-resetplan],[data-closesheet],[data-eq],[data-undo],[data-rir],[data-swap],[data-doswap],[data-dislike],[data-weighin],[data-savewt],[data-doimport],[data-confok],[data-deload],[data-morehist],[data-redosetup],[data-clearlikes],[data-wz],[data-pf-set],[data-wday],[data-gday],[data-eqp],[data-avd],[data-loc],[data-pick],[data-go],[data-editsession],[data-fcore],[data-demo],[data-figplay],[data-delhist],[data-install],#exportBtn,#importBtn,#wipeBtn");
  if(!t) return; const D=t.dataset;

  if(D.demo!==undefined&&D.demo!==""){ ev.preventDefault(); openDemo(D.demo); return; }
  if("figplay" in D){ const box=t.closest(".demo").querySelector(".figbox");
    const on=box.dataset.mode==="loop";
    box.dataset.mode=on?"manual":"loop"; t.querySelector("use").setAttribute("href",on?"#i-play":"#i-pause");
    mountFigs(); return; }
  if("undo" in D){ if(_undo) _undo(); _undo=null; $("#toast").classList.remove("on"); return; }
  if(D.rir){ const [id,j]=D.rir.split("|"); const s=S.current.entries[id][+j];
    const seq=["","3","2","1","0"]; s.rir=seq[(seq.indexOf(s.rir||"")+1)%seq.length]; buzz(6); save(); patchEx(id); return; }
  if(D.swap){ const [dk,xid]=D.swap.split("|"); openSwap(xid,dk); return; }
  if(D.doswap){ const [k,oldId,newId]=D.doswap.split("|"); swapExercise(k,oldId,newId);
    save(); closeSheet(); render(); toast("Swapped in"); return; }
  if(D.dislike){ const [dk2,xid2]=D.dislike.split("|"); const pf=S.profile||(S.profile={dislikes:[]}); pf.dislikes=pf.dislikes||[];
    if(!pf.dislikes.includes(xid2)) pf.dislikes.push(xid2);
    const dayKey=dk2, alt=altsFor(dayKey,xid2)[0]; const D_dislike=xid2;
    if(alt) swapExercise(dayKey,D_dislike,alt.i);
    save(); closeSheet(); render(); toast(alt?"Swapped and won't suggest it again":"Noted — it won't come back","i-trash"); return; }
  if("weighin" in D){ openWeighin(); return; }
  if("savewt" in D){ const v=parseFloat($("#wIn").value);
    if(v>0){ S.weighins=(S.weighins||[]).filter(x=>x.d!==todayISO()); S.weighins.push({d:todayISO(),w:v});
      S.weighins.sort((a,b)=>a.d<b.d?-1:1); save(); closeSheet(); render(); toast("Logged"); } return; }
  if("doimport" in D){ const s=$("#impIn").value.trim(); if(!s) return;
    try{ const o=JSON.parse(s); S=Object.assign(S,o); if(!S.program) S.program=buildPlan(S.profile||{});
      save(); closeSheet(); render(); toast("Backup restored","i-restore"); }
    catch(err){ toast("That backup couldn't be read","i-x"); } return; }
  if("confok" in D){ const cb=_conf; _conf=null; closeSheet(); if(cb) cb(); return; }
  if("clearlikes" in D){ if(S.profile) S.profile.dislikes=[]; save(); render(); toast("Cleared"); return; }
  if("install" in D){ if(deferredPrompt){ const dp=deferredPrompt; dp.prompt(); dp.userChoice.finally(()=>{ deferredPrompt=null; render(); }); } return; }
  if("deload" in D){ S.settings.deload=true; save(); render(); toast("Deload week on"); return; }
  if("morehist" in D){ S.ui.histN=(S.ui.histN||8)+10; render(); return; }
  if(D.delhist!==undefined&&D.delhist!==""){ const i=+D.delhist, h=S.history[i]; if(!h) return;
    confirmSheet("Delete this session?",`${(P().days[h.day]||{}).name||h.day} on ${fmtDate(h.date)} — ${volume(h.entries).toLocaleString()} ${U()} — comes out of your history. Each exercise's stats are recalculated from what's left. This can't be undone.`,"Delete",()=>{ S.history.splice(i,1); save(); render(); toast("Session deleted","i-trash"); },1); return; }
  if("redosetup" in D){ W={step:0,pf:Object.assign(W.pf,S.profile||{})}; S.profile=null; save(); render(); return; }
  if(D.wz){ wizNext(+D.wz); return; }
  if(D.pfSet){ const [f,v]=D.pfSet.split("|"); W.pf[f]=isNaN(+v)||f==="split"||f==="goal"||f==="exp"||f==="where"?v:+v;
    if(f==="days"){ W.pf.weekdays=WDAYS.slice(0,7).filter((d,i)=>[[0,2],[0,2,4],[0,1,3,5],[0,1,3,4,6],[0,1,2,4,5,6]][Math.max(0,W.pf.days-2)].includes(i)); W.pf.gymDays=[]; }
    render(); return; }
  if(D.wday){ const a=W.pf.weekdays, i=a.indexOf(D.wday); i<0?a.push(D.wday):a.splice(i,1);
    a.sort((x,y)=>WDAYS.indexOf(x)-WDAYS.indexOf(y)); render(); return; }
  if(D.gday){ const a=W.pf.gymDays, i=a.indexOf(D.gday); i<0?a.push(D.gday):a.splice(i,1); render(); return; }
  if(D.eqp){ const a=W.pf.equip, i=a.indexOf(D.eqp); i<0?a.push(D.eqp):a.splice(i,1); render(); return; }
  if(D.avd){ const a=W.pf.avoid, i=a.indexOf(D.avd); i<0?a.push(D.avd):a.splice(i,1); render(); return; }
  if(D.tab){ if(D.tab!==S.ui.tab) buzz(6); S.ui.tab=D.tab; save(); render(); return; }
  if(D.start){ openBuilder(D.start); return; }
  if(D.open!==undefined&&D.open!==""){ const card=t.closest(".ex");
    S.current.open=S.current.open===D.open?null:D.open; save();
    document.querySelectorAll(".ex").forEach(c=>c.classList.toggle("open",c.dataset.ex===S.current.open)); return; }
  if(D.tick){ const [id,j]=D.tick.split("|"); const st=S.current.entries[id][+j]; const ex=getEx(id);
    const prev=Object.assign({},st);
    st.done=!st.done;
    if(st.done){ if(!st.r) st.r=String(ex.hi); beep(720,70); buzz(15); startRest(ex.rest,`${ex.n} · set ${+j+1}`);
      _undo=()=>{ Object.assign(S.current.entries[id][+j],prev); clearInterval(rest.tick); rest.end=0; if(S.current)delete S.current.restEnd; save(); render(); };
      toast("Set "+(+j+1)+" logged","i-check","Undo"); }
    save(); render(); return; }
  if(D.count){ const [id,j]=D.count.split("|"); openCounter(id,+j); return; }
  if("finish" in D){ finishSession(); return; }
  if("cancel" in D){ confirmSheet("Discard this session?","Nothing from it will be saved.","Discard",()=>{
      S.current=null; clearInterval(rest.tick); rest.end=0; save(); keepAwake(false); render(); },1); return; }
  if(D.wstep){ const [id,dir]=D.wstep.split("|"); const ex=getEx(id);
    S.current.entries[id].forEach(s=>{ if(s.done)return; const v=parseFloat(s.w); const base=isNaN(v)?0:v;
      s.w=String(Math.max(0,+(base+Number(dir)*Number(ex.inc||2.5)).toFixed(2))); });
    buzz(8); save(); patchEx(id); return; }
  if(D.rstep){ const [id,j,dir]=D.rstep.split("|"); const st=S.current.entries[id][+j]; const ex=getEx(id);
    const cur=parseInt(st.r); st.r=String(Math.max(0,(isNaN(cur)?ex.hi:cur)+Number(dir))); buzz(8); save(); patchEx(id); return; }
  if(D.cw){ const st=S.current.entries[rep.exId][rep.idx]; const ex=getEx(rep.exId);
    const v=parseFloat(st.w); const base=isNaN(v)?0:v;
    st.w=String(Math.max(0,+(base+Number(D.cw)*Number(ex.inc||2.5)).toFixed(2))); buzz(8); save(); drawW(); return; }
  if(D.rest){ if(D.rest==="skip"){ clearInterval(rest.tick); rest.end=0; if(S.current){delete S.current.restEnd;} save(); }
      else { rest.end+=15000; if(S.current) S.current.restEnd=rest.end; save(); } tickRest(); drawDock(); return; }
  if(D.tempo){ S.settings.tempo=+D.tempo; save();
    document.querySelectorAll("[data-tempo]").forEach(b=>b.classList.toggle("on",+b.dataset.tempo===S.settings.tempo)); return; }
  if(D.theme){ S.settings.theme=D.theme; save(); render(); return; }
  if(D.unit){ S.settings.unit=D.unit; if(S.profile) S.profile.unit=D.unit; save(); render(); return; }
  if(D.countin){ S.settings.countIn=+D.countin; save(); render(); return; }
  if(D.toggle){ S.settings[D.toggle]=!S.settings[D.toggle]; save(); render(); if(D.toggle==="sound") beep(760,90); return; }
  if(D.color){ const [k,c]=D.color.split("|"); P().days[k].color=c; save();
    if($("#sheet").classList.contains("on")) editDay(k); render(); return; }
  if(D.editday){ editDay(D.editday); return; }
  if(D.editex){ const [k,id]=D.editex.split("|"); editExercise(k,id); return; }
  if(D.addex){ editExercise(D.addex,null); return; }
  if(D.move){ const [k,i,dir]=D.move.split("|"); const a=P().days[k].ex; const j=+i+ +dir;
    if(j<0||j>=a.length) return; [a[+i],a[j]]=[a[j],a[+i]]; save(); render(); return; }
  if("fcore" in D){ window._draft.core=window._draft.core?0:1; t.classList.toggle("on",!!window._draft.core); return; }
  if(D.loc){ B.loc=D.loc; S.ui.loc=D.loc;
    if(!B.edit){ const saved=((S.ui.lastPicks||{})[B.day+"|"+B.loc]||[]).filter(id=>getEx(id));
      B.picks=new Set(saved.length?saved:recommend(B.day,B.loc)); }
    drawBuilder(); return; }
  if(D.pick){ B.picks.has(D.pick)?B.picks.delete(D.pick):B.picks.add(D.pick); drawBuilder(); return; }
  if("go" in D){ applyBuilder(); return; }
  if("editsession" in D){ openBuilder(S.current.day,true); return; }
  if(D.eq){ window._draft.eq=D.eq;
    document.querySelectorAll("[data-eq]").forEach(b=>b.classList.toggle("on",b.dataset.eq===D.eq)); return; }
  if(D.saveex){ const [k,id]=D.saveex.split("|"); const e=window._draft;
    const g=s=>$("#"+s).value.trim();
    e.n=g("fN")||"Untitled exercise"; e.s=Math.max(1,+g("fS")||3); e.rest=Math.max(0,+g("fRest")||60);
    e.lo=Math.max(1,+g("fLo")||8); e.hi=Math.max(e.lo,+g("fHi")||12); e.inc=Math.abs(parseFloat(g("fInc")))||2.5; e.tip=g("fTip");
    e.loc=$("#fLoc").value; e.pat=e.pat||"Accessory";
    const arr=P().days[k].ex; const i=arr.findIndex(x=>x.id===e.id);
    if(i<0) arr.push(e); else arr[i]=e;
    if(S.current&&S.current.day===k){ const st=S.current.entries[e.id]||[];
      while(st.length<e.s) st.push({w:st[0]?st[0].w:"",r:"",done:false}); st.length=e.s; S.current.entries[e.id]=st; }
    save(); closeSheet(); render(); toast("Exercise saved"); return; }
  if(D.delex){ const [k,id]=D.delex.split("|");
    confirmSheet("Remove from the plan?","Your logged history for it is kept — it just won't be offered any more.","Remove",()=>{
      P().days[k].ex=P().days[k].ex.filter(x=>x.id!==id);
      if(S.current&&S.current.entries[id]) delete S.current.entries[id];
      if(S.current&&S.current.picks) S.current.picks=S.current.picks.filter(x=>x!==id);
      save(); closeSheet(); render(); toast("Removed","i-trash"); },1); return; }
  if(D.saveday){ const k=D.saveday; P().days[k].name=$("#dN").value.trim()||P().days[k].name;
    P().days[k].sub=$("#dS").value.trim(); save(); closeSheet(); render(); toast("Day saved"); return; }
  if("resetplan" in D){ confirmSheet("Rebuild the plan?","It goes back to what your setup answers generate. History is kept.","Rebuild",()=>{
    S.program=buildPlan(S.profile||{}); save(); render(); toast("Plan rebuilt","i-restore"); }); return; }
  if("closesheet" in D){ closeSheet(); return; }

  if(t.id==="exportBtn"){ const d=JSON.stringify(S);
    try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([d],{type:"application/json"}));
      a.download="iron-backup-"+todayISO()+".json"; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast("Backup file saved","i-copy");
    }catch(err){ if(navigator.clipboard) navigator.clipboard.writeText(d).then(()=>toast("Backup copied","i-copy")); }
    return; }
  if(t.id==="importBtn"){ openSheet(`<h3 class="sheet-h">Restore a backup</h3>
      <div class="f"><label class="fl">Paste the backup text</label><textarea class="txt" id="impIn" rows="5" style="resize:vertical"></textarea></div>
      <button class="btn" data-doimport>${ic("i-restore")}Restore</button>
      <div style="height:9px"></div><button class="btn ghost sm" data-closesheet>Cancel</button>`); return; }
  if(t.id==="wipeBtn"){ confirmSheet("Erase all history?","Every logged session goes. This can't be undone.","Erase everything",()=>{
      S.history=[]; S.current=null; S.startDate=null; save(); render(); toast("History erased","i-trash"); },1); return; }
});
$("#scrim").onclick=closeSheet;
document.addEventListener("input",e=>{
  if(e.target.dataset.pf){ W.pf[e.target.dataset.pf]=e.target.value; if(e.target.dataset.pf==="unit") render(); return; }
  if("figscrub" in e.target.dataset){ const demo=e.target.closest(".demo"), box=demo.querySelector(".figbox");
    box.dataset.mode="manual"; figAnim.delete(box);
    const pb=demo.querySelector("[data-figplay] use"); if(pb) pb.setAttribute("href","#i-play");
    paintFig(box,box.dataset.fig,(+e.target.value)/100); return; }
  const r=e.target.dataset.r;
  if(r){ const [id,j]=r.split("|"); S.current.entries[id][+j].r=e.target.value.replace(/[^\d]/g,""); save(); }
  if(e.target.id==="progSel"){ S.ui.progressEx=e.target.value; save(); render(); }
});
$("#cClose").onclick=()=>{ if(rep.count>0) finishSet(); else { stopLoop(); rep.active=false; $("#counter").classList.remove("on"); } };
$("#cPlay").onclick=()=>{ if(rep.active&&!rep.paused){ stopLoop(); drawCounter(); } else startLoop(); };
$("#cPlus").onclick=()=>{ rep.count++; drawCounter(); beep(760,60,.14); buzz(10); mflash();
  if(rep.count>=rep.target){ beep(980,220,.28); finishSet(); } };
$("#cMinus").onclick=()=>{ rep.count=Math.max(0,rep.count-1); drawCounter(); buzz(8); };
$("#cDone").onclick=finishSet;
$("#cTap").onclick=()=>{ if(rep.active&&!rep.paused) return;
  rep.count++; drawCounter(); beep(760,60,.15); say(String(rep.count)); buzz(12);
  pulse(1); mflash(); setTimeout(()=>pulse(.5),170);
  if(rep.count>=rep.target){ beep(980,220,.28); finishSet(); } };

function patchEx(id){ const el=document.querySelector(`.ex[data-ex="${id}"]`); if(!el) return;
  const list=sessionList(); const i=list.findIndex(e=>e.id===id); if(i<0) return;
  el.outerHTML=exCard(list[i],i); drawDock(); mountFigs(); }
setInterval(()=>{ const c=$("#clk"); if(c&&S.current) c.textContent=mmss((Date.now()-S.current.startedAt)/1000); },1000);

/* ═══════════ PWA: install + service worker ═══════════ */
let deferredPrompt=null;
const STANDALONE=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
function installCard(){
  if(STANDALONE) return "";
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(deferredPrompt) return `<div class="card" style="border-color:color-mix(in srgb,var(--accent) 45%,var(--line))"><h4>${ic("i-hand","sm")}Install Iron</h4>
    <div class="sub" style="margin-bottom:12px">Add it to your home screen — full screen, offline, no browser bar.</div>
    <button class="btn" data-install>${ic("i-down","sm")}Add to Home Screen</button></div>`;
  if(ios) return `<div class="card"><h4>${ic("i-hand","sm")}Install Iron</h4>
    <div class="sub" style="line-height:1.55">In Safari, tap the Share button, then <b>Add to Home Screen</b>. Iron then opens full screen and works with no internet.</div></div>`;
  return "";
}
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferredPrompt=e; if(S.profile&&S.ui&&S.ui.tab==="settings") render(); });
window.addEventListener("appinstalled",()=>{ deferredPrompt=null; toast("Installed — open Iron from your home screen","i-check"); });
if("serviceWorker" in navigator) window.addEventListener("load",()=>{
  navigator.serviceWorker.register("service-worker.js").then(reg=>{
    reg.addEventListener("updatefound",()=>{ const w=reg.installing; if(!w) return;
      w.addEventListener("statechange",()=>{ if(w.state==="installed"&&navigator.serviceWorker.controller) toast("Update ready — reopen to refresh","i-restore"); }); });
  }).catch(()=>{});
});

/* ═══════════ BOOT ═══════════ */
(async function(){
  const saved=await DB.load(KEY);
  if(saved) S=Object.assign(S,saved,{settings:Object.assign(S.settings,saved.settings||{}),ui:Object.assign(S.ui,saved.ui||{})});
  if(S.program&&(S.program.lib||0)<3&&!S.profile){ S.program=null; S.current=null; }
  if(S.current&&!S.current.picks) S.current.picks=Object.keys(S.current.entries);
  if(!saved){ const old=await DB.load(OLD);
    if(old&&old.history){ S.history=old.history; S.startDate=old.startDate||null; save(); } }
  if(S.current&&!S.current.startedAt) S.current.startedAt=Date.now();
  if(S.current&&S.current.restEnd&&S.current.restEnd<=Date.now()){ delete S.current.restEnd; delete S.current.restTotal; delete S.current.restLabel; }
  render();
})();
</script>
</body>
